name: Synchronize portfolio languages
on:
  push:
    branches: [main]
    paths:
      - 'en/index.html'
      - 'scripts/sync_portfolio.py'
      - '.github/workflows/sync-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize shared project cards
        run: python3 scripts/sync_portfolio.py
      - name: Commit synchronized translations
        run: |
          if ! git diff --quiet -- index.html es/index.html it/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html es/index.html it/index.html
            git commit -m "Sync shared portfolio cards from English master"
            git push
          fi
